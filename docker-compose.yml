services:
  cataloguecanvas:
    build:
      context: .
      args:
        CC_GIT_SHA: ${CC_GIT_SHA:-unknown}
        CC_BUILD_DATE: ${CC_BUILD_DATE:-unknown}
    ports:
      - "${CC_PORT:-8000}:8000"
    environment:
      # No default password: the app fails closed (no admin login) until this is
      # set, so an unconfigured deployment can't ship a known credential.
      CC_ADMIN_PASSWORD: ${CC_ADMIN_PASSWORD:?set CC_ADMIN_PASSWORD in your .env}
      CC_SITE_TITLE: ${CC_SITE_TITLE:-CatalogueCanvas}
      CC_SITE_AUTHOR: ${CC_SITE_AUTHOR:-}
      # Secure cookies by default; set to false only for plain-HTTP LAN access.
      CC_COOKIE_SECURE: ${CC_COOKIE_SECURE:-true}
      # Telemetry (all anonymous, all opt-in). See README "Telemetry & privacy".
      #   Set to 1 to send a single anonymous install ping (version, OS) on first
      #   boot. Weekly usage stats are a separate toggle in Settings (default off).
      CC_INSTALL_TRACKING: ${CC_INSTALL_TRACKING:-0}
      #   Override to point telemetry at your own PostHog instance, or leave unset.
      # CC_POSTHOG_KEY: ${CC_POSTHOG_KEY:-}
      # CC_POSTHOG_HOST: ${CC_POSTHOG_HOST:-https://eu.i.posthog.com}
      # Refuse requests from public IPs. Default off, so an accidental port
      # forward can't expose the catalogue. Set to true for a deliberately
      # public deployment -- note this also gates public portfolio links.
      CC_ALLOW_EXTERNAL_REQUESTS: ${CC_ALLOW_EXTERNAL_REQUESTS:-false}
      # Behind a reverse proxy, list its address here so the real client IP can
      # be read from X-Forwarded-For. Unset means the header is ignored, since
      # trusting it from any peer would let a caller spoof a private address.
      CC_TRUSTED_PROXIES: ${CC_TRUSTED_PROXIES:-}
      # Activity log (who uploaded/edited/deleted what). On by default; set to 0
      # to disable. Written to <data dir>/logs/audit.log as JSONL.
      CC_AUDIT_LOG: ${CC_AUDIT_LOG:-1}
    volumes:
      - ./data:/data
      # Source folder for `cc ingest /data/import`. Read-only: ingest copies
      # into the library, it never writes back here.
      - ./import:/data/import:ro

  # Dev-only toolchain for the web app: install deps, lint, type-check, test.
  # The cataloguecanvas image is a production build (no devDependencies, only
  # web/dist survives the multi-stage copy), so it can't run any of these.
  # Pinned to the same node:22-slim digest as the Dockerfile's web-build stage
  # so the lockfile is resolved by the same npm that builds the shipped image.
  # Under the "dev" profile, so a plain `docker compose up` ignores it.
  web-dev:
    image: node:22-slim@sha256:813a7480f28fdadac1f7f5c824bcdad435b5bc1322a5968bbbdef8d058f9dff4
    working_dir: /app/web
    volumes:
      - ./web:/app/web
    profiles: ["dev"]

  # Dev-only backend toolchain: runs pytest against the same Python base the
  # production image uses. The shipped image installs with --no-dev and drops
  # the build toolchain, so it can't run the suite itself.
  # Also under the "dev" profile, so `docker compose up` ignores it.
  server-dev:
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    working_dir: /app/server
    volumes:
      - ./server:/app/server
    environment:
      # Throwaway config: tests must never touch a real data dir.
      CC_DATA_DIR: /tmp/cc-test-data
      CC_ADMIN_PASSWORD: hunter2
      CC_SECRET_KEY: test-secret-key-not-for-production
      CC_COOKIE_SECURE: "false"
    profiles: ["dev"]
