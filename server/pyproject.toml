[project]
name = "cataloguecanvas-server"
version = "0.2.2"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.3",
    "pillow>=12.3.0",
    "cairosvg>=2.9.0",
    "python-multipart>=0.0.32",
    "itsdangerous>=2.2",
    "passlib[argon2]>=1.7.4",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "lz4>=4.4.5",
    "psutil>=7.2.2",
]

[project.scripts]
cc = "cataloguecanvas.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "coverage[toml]>=7.15.4",
    "respx>=0.23.1",
    "pip-audit>=2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Floor set just below the achieved level so CI catches regressions without
# being fragile. Ratchet up as coverage grows (static_export, routers remain).
addopts = "-q --cov --cov-fail-under=65"

[tool.coverage.run]
source = ["cataloguecanvas"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.bandit]
skips = ["B101"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cataloguecanvas"]

[tool.hatch.build.targets.wheel.force-include]
"src/cataloguecanvas/wordlist.txt" = "cataloguecanvas/wordlist.txt"
"src/cataloguecanvas/prompt.template.toml" = "cataloguecanvas/prompt.template.toml"
